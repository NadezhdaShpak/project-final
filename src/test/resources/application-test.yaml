spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;REFERENTIAL_INTEGRITY=false;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      mode: always
      data-locations: classpath:data-test.sql
      schema-locations: classpath:changelog-test.sql
  h2:
    console:
      enabled: true
      path: /h2-console
server:
  port: 5000

